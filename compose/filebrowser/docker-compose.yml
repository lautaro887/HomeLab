services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /data:/srv
      - ~/homelab/filebrowser/config/filebrowser.db:/database.db
    environment:
      - TZ=America/Argentina/Mendoza
    mem_limit: 64m